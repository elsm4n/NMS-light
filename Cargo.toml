[package]
name = "rust-nms"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[[bin]]
name = "rust-nms"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.105"
argon2 = "0.6.0"
async-snmp = { version = "0.18.1", features = ["rt-multi-thread"] }
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.45", features = ["serde"] }
config = "0.15.27"
dotenvy = "0.15.7"
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
ipnet = { version = "2.12.2", features = ["serde"] }
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros", "migrate", "uuid", "chrono", "json", "ipnet"] }
surge-ping = "0.9.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "fs"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "timeout", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.29.3", features = ["serde", "v4"] }
